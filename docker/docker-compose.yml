services:
  db:
    image: postgres:16
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: homevote
      POSTGRES_USER: homevote_user
      POSTGRES_PASSWORD: homeVotePwd26!
    ports:
      - "5432:5432"
    volumes:
      - homevote-data:/var/lib/postgresql/data

volumes:
  homevote-data: